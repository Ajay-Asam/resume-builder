<div *ngIf="resume$ | async as resume">

    <div class="page flex justify-center p-10 gap-5">
   <div>
     <div class="font-bold"> Select Template</div>
     <div>
       <select 
       class="mb-10 border border-gray-300 p-2 rounded-md"
       [value]="template"
       (change)="onTemplateChange($event)"
     >
       <option value="one">Template One</option>
       <option value="two">Template Two</option>
     </select>
   </div>

   </div>
   
      <div id="resume-preview" class="resume-wrapper">
  
        <app-template-one
          *ngIf="template === 'one'"
          [resume]="resume"
        ></app-template-one>
  
        <app-template-two
          *ngIf="template === 'two'"
          [resume]="resume"
        ></app-template-two>
  
      </div>
      <div>
        <button (click)="downloadPdf()" class="bg-blue-100 p-2 rounded-lg">Download PDF</button>
      </div>
    
    </div>
  </div>
